name: aiops-build-push

on:
  push:
    branches:
      - main
    paths:
      - "aiops_framework/**"
      - "pipeline/**"
      - "deploy/aiops/apps/**"
      - "deploy/aiops/docker/**"
      - "tools/update_aiops_gitops_tags.py"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: huymt05
  DEV_OVERLAY: deploy/aiops/environments/dev/kustomization.yaml

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - id: meta
        shell: bash
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: aiops-anomaly-service
            dockerfile: deploy/aiops/docker/Dockerfile.anomaly-service
          - image_name: aiops-rca-service
            dockerfile: deploy/aiops/docker/Dockerfile.rca-service
          - image_name: aiops-orchestrator
            dockerfile: deploy/aiops/docker/Dockerfile.orchestrator
          - image_name: aiops-dashboard
            dockerfile: deploy/aiops/docker/Dockerfile.dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image_name }}:${{ needs.prepare.outputs.image_tag }}

  update-dev-manifests:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update dev overlay image tags
        run: |
          python tools/update_aiops_gitops_tags.py --env dev --tag "${{ needs.prepare.outputs.image_tag }}"

      - name: Commit manifest update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${DEV_OVERLAY}"
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git commit -m "chore(gitops): update aiops dev images to ${{ needs.prepare.outputs.image_tag }}"
          git push
