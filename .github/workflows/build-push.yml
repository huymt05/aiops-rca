name: aiops-build-push

on:
  push:
    branches:
      - main
    paths:
      - "aiops_framework/dashboard/**"
      - "aiops_framework/inference/**"
      - "aiops_framework/core/**"
      - "aiops_framework/mlops/**"
      - "aiops_framework/registry/**"
      - "aiops_framework/system/**"
      - "aiops_framework/systems/**"
      - "config/**"
      - "pipeline/**"
      - "data_anomaly_balanced_v3/models/**"
      - "data_rca_balanced_v3/models/**"
      - "tools/update_aiops_gitops_tags.py"
      - "deploy/aiops/docker/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: huymt05
  DEV_OVERLAY: deploy/aiops/environments/dev/kustomization.yaml

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install unit-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check pytest

      - name: Run unit tests
        run: pytest tests/tools -q

      - name: Run SonarQube scan when configured
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=aiops-rca
            -Dsonar.sources=aiops_framework,pipeline,tools
            -Dsonar.python.version=3.11

      - name: Skip SonarQube scan when secrets are missing
        if: ${{ !(env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '') }}
        run: echo "Skipping SonarQube scan because SONAR_TOKEN or SONAR_HOST_URL is not configured."

      - name: Set up Node.js for Snyk CLI
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Snyk CLI
        if: ${{ env.SNYK_TOKEN != '' }}
        run: npm install -g snyk

      - name: Run Snyk Code scan when configured
        if: ${{ env.SNYK_TOKEN != '' }}
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high

      - name: Skip Snyk Code scan when token is missing
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "Skipping Snyk Code scan because SNYK_TOKEN is not configured."

  prepare:
    runs-on: ubuntu-latest
    needs: quality-gates
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      matrix: ${{ steps.compute.outputs.matrix }}
      should_build: ${{ steps.compute.outputs.should_build }}
      images_csv: ${{ steps.compute.outputs.images_csv }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: meta
        shell: bash
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Detect changed service scopes
        id: changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared_all:
              - 'aiops_framework/core/**'
              - 'aiops_framework/mlops/**'
              - 'aiops_framework/registry/**'
              - 'aiops_framework/system/**'
              - 'aiops_framework/systems/**'
              - 'aiops_framework/inference/common/**'
              - 'config/**'
              - 'pipeline/**'
              - 'tools/update_aiops_gitops_tags.py'
              - 'tests/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/build-push.yml'
            dashboard:
              - 'aiops_framework/dashboard/**'
              - 'deploy/aiops/docker/Dockerfile.dashboard'
              - 'data_anomaly_balanced_v3/models/**'
              - 'data_rca_balanced_v3/models/**'
            orchestrator:
              - 'aiops_framework/inference/orchestrator/**'
              - 'deploy/aiops/docker/Dockerfile.orchestrator'
            anomaly_service:
              - 'aiops_framework/inference/anomaly_service/**'
              - 'deploy/aiops/docker/Dockerfile.anomaly-service'
              - 'data_anomaly_balanced_v3/models/**'
            rca_service:
              - 'aiops_framework/inference/rca_service/**'
              - 'deploy/aiops/docker/Dockerfile.rca-service'
              - 'data_rca_balanced_v3/models/**'

      - name: Compute build matrix
        id: compute
        shell: bash
        run: |
          declare -a names=()
          declare -a json_items=()
          declare -a full_images=()

          add_service() {
            local image_name="$1"
            local dockerfile="$2"
            names+=("${image_name}")
            full_images+=("ghcr.io/${IMAGE_OWNER}/${image_name}")
            json_items+=("{\"image_name\":\"${image_name}\",\"dockerfile\":\"${dockerfile}\"}")
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ steps.changes.outputs.shared_all }}" == "true" ]]; then
            add_service "aiops-anomaly-service" "deploy/aiops/docker/Dockerfile.anomaly-service"
            add_service "aiops-rca-service" "deploy/aiops/docker/Dockerfile.rca-service"
            add_service "aiops-orchestrator" "deploy/aiops/docker/Dockerfile.orchestrator"
            add_service "aiops-dashboard" "deploy/aiops/docker/Dockerfile.dashboard"
          else
            [[ "${{ steps.changes.outputs.anomaly_service }}" == "true" ]] && add_service "aiops-anomaly-service" "deploy/aiops/docker/Dockerfile.anomaly-service"
            [[ "${{ steps.changes.outputs.rca_service }}" == "true" ]] && add_service "aiops-rca-service" "deploy/aiops/docker/Dockerfile.rca-service"
            [[ "${{ steps.changes.outputs.orchestrator }}" == "true" ]] && add_service "aiops-orchestrator" "deploy/aiops/docker/Dockerfile.orchestrator"
            [[ "${{ steps.changes.outputs.dashboard }}" == "true" ]] && add_service "aiops-dashboard" "deploy/aiops/docker/Dockerfile.dashboard"
          fi

          if [[ ${#json_items[@]} -eq 0 ]]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "images_csv=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matrix="[$(IFS=,; echo "${json_items[*]}")]"
          images_csv="$(IFS=,; echo "${full_images[*]}")"

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "images_csv=${images_csv}" >> "$GITHUB_OUTPUT"

  build-scan-and-push:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image locally for Trivy scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: local/${{ matrix.image_name }}:${{ needs.prepare.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: local/${{ matrix.image_name }}:${{ needs.prepare.outputs.image_tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image_name }}:${{ needs.prepare.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-dev-manifests:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-scan-and-push
    if: needs.prepare.outputs.should_build == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update dev overlay image tags
        shell: bash
        run: |
          IFS=',' read -ra IMAGES <<< "${{ needs.prepare.outputs.images_csv }}"
          args=()
          for image in "${IMAGES[@]}"; do
            [[ -n "${image}" ]] && args+=(--image "${image}")
          done
          python tools/update_aiops_gitops_tags.py --env dev --tag "${{ needs.prepare.outputs.image_tag }}" "${args[@]}"

      - name: Commit manifest update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${DEV_OVERLAY}"
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git commit -m "chore(gitops): update aiops dev images to ${{ needs.prepare.outputs.image_tag }}"
          git push
