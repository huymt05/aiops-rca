name: aiops-ci

on:
  push:
    branches:
      - main
    paths:
      - "aiops_framework/**"
      - "pipeline/**"
      - "deploy/aiops/**"
      - "deploy/argocd/**"
      - "tools/update_aiops_gitops_tags.py"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/build-push.yml"
  pull_request:
    paths:
      - "aiops_framework/**"
      - "pipeline/**"
      - "deploy/aiops/**"
      - "deploy/argocd/**"
      - "tools/update_aiops_gitops_tags.py"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI helpers and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check pytest pyyaml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Python entrypoints
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          targets = [
              Path("aiops_framework/dashboard/app.py"),
              Path("aiops_framework/dashboard/live_data.py"),
              Path("aiops_framework/inference/anomaly_service/app.py"),
              Path("aiops_framework/inference/rca_service/app.py"),
              Path("aiops_framework/inference/orchestrator/app.py"),
              Path("tools/update_aiops_gitops_tags.py"),
          ]

          for path in targets:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print(f"validated {path}")
          PY

      - name: Run unit tests
        run: pytest tests/tools -q

      - name: Validate dashboard JavaScript
        run: |
          node --check aiops_framework/dashboard/static/dashboard_v2.js
          node --check aiops_framework/dashboard/static/dashboard.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AI/Ops images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/aiops/docker/Dockerfile.anomaly-service
          push: false
          tags: local/aiops-anomaly-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build RCA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/aiops/docker/Dockerfile.rca-service
          push: false
          tags: local/aiops-rca-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/aiops/docker/Dockerfile.orchestrator
          push: false
          tags: local/aiops-orchestrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/aiops/docker/Dockerfile.dashboard
          push: false
          tags: local/aiops-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Validate AI/Ops overlays
        run: |
          kustomize build deploy/aiops/environments/dev > /tmp/aiops-dev.yaml
          kustomize build deploy/aiops/environments/prod > /tmp/aiops-prod.yaml

      - name: Validate frontend manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          manifest_path = Path("kubernetes-manifests/frontend.yaml")
          docs = [doc for doc in yaml.safe_load_all(manifest_path.read_text(encoding="utf-8")) if doc]

          if not docs:
              raise SystemExit("frontend.yaml did not contain any Kubernetes resources")

          allowed = {
              ("apps/v1", "Deployment"),
              ("v1", "Service"),
              ("v1", "ServiceAccount"),
          }

          for index, doc in enumerate(docs, start=1):
              api_version = doc.get("apiVersion")
              kind = doc.get("kind")
              name = ((doc.get("metadata") or {}).get("name"))
              if (api_version, kind) not in allowed:
                  raise SystemExit(f"Unexpected resource #{index}: {(api_version, kind)}")
              if not name:
                  raise SystemExit(f"Resource #{index} is missing metadata.name")
              print(f"validated {kind}/{name}")
          PY

  code-scan:
    runs-on: ubuntu-latest
    needs: validate-and-test
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run SonarQube scan when configured
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=aiops-rca
            -Dsonar.sources=aiops_framework,pipeline,tools
            -Dsonar.python.version=3.11

      - name: Skip SonarQube scan when secrets are missing
        if: ${{ !(env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '') }}
        run: echo "Skipping SonarQube scan because SONAR_TOKEN or SONAR_HOST_URL is not configured."

      - name: Set up Node.js for Snyk CLI
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Snyk CLI
        if: ${{ env.SNYK_TOKEN != '' }}
        run: npm install -g snyk

      - name: Run Snyk Code scan when configured
        if: ${{ env.SNYK_TOKEN != '' }}
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high

      - name: Skip Snyk Code scan when token is missing
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "Skipping Snyk Code scan because SNYK_TOKEN is not configured."
