system_id: online-boutique-staging
system_family: ecommerce
display_name: Online Boutique Staging
namespace: online-boutique-staging

entry_services:
  - frontend-staging

jaeger_services:
  - frontend-staging
  - checkoutservice-staging
  - currencyservice-staging
  - recommendationservice-staging
  - productcatalogservice-staging
  - paymentservice-staging
  - emailservice-staging

prometheus_labels:
  namespace: online-boutique-staging

model_profile:
  anomaly:
    registry_root: ../../../data_anomaly_balanced_v3/models
    stage: production
  rca:
    registry_root: ../../../data_rca_balanced_v3/models
    stage: production

trace_adapter: jaeger
metric_adapter: prometheus
log_adapter: kubectl

service_catalog: service_catalog.json
