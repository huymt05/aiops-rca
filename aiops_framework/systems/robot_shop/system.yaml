system_id: robot_shop
name: Robot Shop
system_family: ecommerce
display_name: Robot Shop
namespace: robot-shop

entry_services:
  - web

jaeger_services:
  - web
  - catalogue
  - user
  - cart
  - shipping
  - payment
  - ratings
  - dispatch
  - mongodb
  - rabbitmq
  - mysql

prometheus_labels:
  namespace: robot-shop

model_profile:
  anomaly:
    registry_root: ../../../data_anomaly_balanced_v3/models
    stage: production
  rca:
    registry_root: ../../../data_rca_balanced_v3/models
    stage: production

trace_adapter: jaeger
metric_adapter: prometheus
log_adapter: kubectl

service_catalog: service_catalog.json