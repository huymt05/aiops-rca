apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-boutique-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/huymt05/aiops-rca.git
    targetRevision: main
    path: deploy/systems/online-boutique-staging
  destination:
    server: https://kubernetes.default.svc
    namespace: online-boutique-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
