apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: aiops-mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/part-of: aiops-mlops
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.7.0
          command:
            - /bin/sh
            - -c
          args:
            - >-
              python -m pip install --no-cache-dir psycopg2-binary boto3 &&
              mlflow server
              --host 0.0.0.0
              --port 5000
              --backend-store-uri postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-mlflow:5432/$(POSTGRES_DB)
              --artifacts-destination $(MLFLOW_ARTIFACT_ROOT)
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: mlops-postgres-auth
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mlops-postgres-auth
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlops-postgres-auth
                  key: POSTGRES_PASSWORD
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mlops-minio-auth
                  key: MINIO_ROOT_USER
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mlops-minio-auth
                  key: MINIO_ROOT_PASSWORD
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://minio.mlops.svc.cluster.local:9000
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: MLFLOW_ARTIFACT_ROOT
              value: s3://mlflow/
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: aiops-mlops
spec:
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
