apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-mlflow-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-mlflow
  labels:
    app.kubernetes.io/name: postgres-mlflow
    app.kubernetes.io/part-of: aiops-mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-mlflow
        app.kubernetes.io/part-of: aiops-mlops
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: mlops-postgres-auth
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-mlflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-mlflow
  labels:
    app.kubernetes.io/name: postgres-mlflow
    app.kubernetes.io/part-of: aiops-mlops
spec:
  selector:
    app.kubernetes.io/name: postgres-mlflow
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
