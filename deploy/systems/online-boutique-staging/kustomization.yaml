apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: online-boutique-staging

resources:
  - namespace.yaml
  - ../../../kubernetes-manifests
  - loadgenerator.yaml

patches:
  - path: otel-service-name-patches.yaml
  - target:
      kind: Service
      name: frontend-external
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
