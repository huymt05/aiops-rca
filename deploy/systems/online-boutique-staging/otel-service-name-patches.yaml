apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      containers:
      - name: server
        env:
        - name: OTEL_SERVICE_NAME
          value: frontend-staging
        - name: COLLECTOR_SERVICE_ADDR
          value: opentelemetrycollector.app.svc.cluster.local:4317
---
